<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตลาดนัดนักเรียน</title>
<style>
  :root{
    --night: #10221f;
    --stall: #17352f;
    --stall-2: #1f4038;
    --lantern: #f2a541;
    --lantern-2: #e0672c;
    --mint: #7fd8b8;
    --paper: #f4ecd8;
    --loss: #e06262;
    --border: rgba(242,165,65,0.25);
    font-family: 'Segoe UI', 'Sarabun', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(242,165,65,0.12), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(127,216,184,0.10), transparent 40%),
      var(--night);
    color: var(--paper);
    min-height:100vh;
    padding-bottom:60px;
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 22px;border-bottom:1px solid var(--border);
    background:rgba(0,0,0,0.15);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);
  }
  .topbar h1{font-size:1.15rem;margin:0;letter-spacing:0.3px;}
  .topbar h1 span{color:var(--lantern);}
  .stats{display:flex;gap:18px;align-items:center;font-size:0.9rem;}
  .cash{font-weight:700;color:var(--lantern);font-size:1.1rem;}
  .timer{padding:5px 12px;border-radius:20px;background:var(--stall-2);border:1px solid var(--border);}
  .timer.low{background:rgba(224,98,98,0.25);border-color:var(--loss);color:#ffb3b3;}

  #login{
    max-width:380px;margin:14vh auto;padding:28px;
    background:var(--stall);border:1px solid var(--border);border-radius:16px;
    text-align:center;
  }
  #login h2{color:var(--lantern);margin-top:0;}
  #login input{
    width:100%;padding:11px;margin:8px 0;border-radius:8px;border:1px solid var(--border);
    background:var(--night);color:var(--paper);font-size:1rem;
  }
  #login button{
    width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;
    background:linear-gradient(135deg,var(--lantern),var(--lantern-2));
    color:#241205;font-weight:700;font-size:1rem;cursor:pointer;
  }
  #login .msg{color:var(--loss);min-height:20px;font-size:0.85rem;margin-top:6px;}

  main{max-width:1100px;margin:0 auto;padding:20px;display:none;}
  main.show{display:block;}

  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--stall);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-bottom:18px;
  }
  .card h3{margin:0 0 12px;font-size:1rem;color:var(--mint);
    display:flex;align-items:center;gap:8px;}
  .card h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lantern);}

  .item-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.92rem;
  }
  .item-row:last-child{border-bottom:none;}
  .emoji{font-size:1.3rem;width:28px;text-align:center;}
  .item-name{flex:1;}
  .item-price{color:var(--lantern);font-weight:700;min-width:70px;text-align:right;}
  .qty-input{
    width:50px;padding:6px;border-radius:6px;border:1px solid var(--border);
    background:var(--night);color:var(--paper);text-align:center;
  }
  .price-input{
    width:65px;padding:6px;border-radius:6px;border:1px solid var(--border);
    background:var(--night);color:var(--paper);text-align:center;
  }
  .btn{
    padding:7px 12px;border:none;border-radius:7px;cursor:pointer;font-weight:600;
    font-size:0.85rem;white-space:nowrap;
  }
  .btn-buy{background:var(--mint);color:#0a2620;}
  .btn-sell{background:var(--lantern);color:#241205;}
  .btn-cancel{background:transparent;border:1px solid var(--loss);color:var(--loss);}
  .btn-buy:hover,.btn-sell:hover{filter:brightness(1.1);}

  .inv-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .inv-item:last-child{border-bottom:none;}
  .inv-cost{font-size:0.75rem;color:#9fb8ae;}

  .leaderboard-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;}
  .leaderboard-row.me{background:rgba(242,165,65,0.12);}
  .rank{width:22px;text-align:center;font-weight:700;color:var(--mint);}
  .lb-name{flex:1;}
  .lb-worth{font-weight:700;color:var(--lantern);}

  /* ===== รถขายของ (food truck stalls) ===== */
  .stall-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:30px 18px;
  }
  .truck{
    position:relative;
    padding-top:6px;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }

  /* หลังคารถ + ป้ายชื่อร้าน */
  .truck-header{
    display:flex;align-items:center;gap:8px;
    background:var(--truck-a);
    filter:brightness(0.95);
    border-radius:14px 14px 4px 4px;
    padding:7px 10px;
    border:1px solid rgba(0,0,0,0.25);
    border-bottom:none;
  }
  .truck-emoji-badge{
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.28);
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;border:2px solid rgba(255,255,255,0.45);
    flex-shrink:0;
  }
  .truck-name{font-weight:800;font-size:0.85rem;line-height:1.15;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);}
  .truck-tag{font-size:0.68rem;color:rgba(255,255,255,0.8);}

  /* หน้าต่างขายของ / เคาน์เตอร์ */
  .truck-window{
    background: linear-gradient(180deg, var(--truck-b), #ffffff08), var(--stall-2);
    border:1px solid rgba(0,0,0,0.25);
    border-top:none;
    border-radius:0 0 6px 6px;
    padding:12px 10px 16px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
  }
  .truck-goods{display:flex;flex-direction:column;gap:8px;}
  .truck-good{
    background:rgba(16,34,31,0.78);border-radius:8px;padding:8px 9px;
    font-size:0.85rem;border:1px solid rgba(255,255,255,0.08);
  }
  .truck-good-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .truck-good-emoji{font-size:1.4rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.4));}
  .truck-good-name{flex:1;font-size:0.82rem;}
  .truck-good-price{color:var(--lantern);font-weight:700;}
  .truck-good-controls{display:flex;gap:6px;align-items:center;}
  .truck-good-controls .qty-input{width:44px;}
  .truck-empty-note{color:#e8dcc4;font-size:0.75rem;font-style:italic;padding:4px 0 0;text-align:center;}

  /* ล้อรถ */
  .truck-wheels{display:flex;justify-content:space-around;padding:0 22px;margin-top:-9px;position:relative;z-index:2;}
  .truck-wheel{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #555, #111 70%);
    border:3px solid #2b2b2b;
  }

  /* ===== การ์ดตั้ง/แก้ไขร้านค้า ===== */
  .shop-setup-styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0;}
  .style-choice{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 6px;border-radius:10px;cursor:pointer;
    border:2px solid transparent;background:var(--night);
    font-size:0.72rem;text-align:center;color:#cfe3db;
  }
  .style-choice .swatch-emoji{font-size:1.4rem;}
  .style-choice.selected{border-color:var(--lantern);background:rgba(242,165,65,0.12);color:var(--paper);}
  .shop-name-input{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--night);color:var(--paper);font-size:0.95rem;margin-bottom:10px;
  }
  .shop-summary{display:flex;align-items:center;gap:12px;}
  .shop-summary .truck-emoji-badge{width:44px;height:44px;font-size:1.5rem;background:var(--stall-2);border-color:var(--border);}
  .shop-summary-info{flex:1;}
  .shop-summary-name{font-weight:700;font-size:1rem;}
  .shop-summary-tag{font-size:0.78rem;color:#9fb8ae;}
  .btn-shop{background:linear-gradient(135deg,var(--lantern),var(--lantern-2));color:#241205;width:100%;padding:11px;font-size:0.95rem;}
  .btn-edit-shop{background:var(--stall-2);border:1px solid var(--border);color:var(--paper);}

  .empty{color:#8fa39c;font-size:0.85rem;padding:8px 0;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--stall-2);border:1px solid var(--lantern);color:var(--paper);
    padding:10px 20px;border-radius:10px;font-size:0.9rem;opacity:0;transition:opacity .3s;
    z-index:50;
  }
  .toast.show{opacity:1;}
  .gameover{
    max-width:420px;margin:12vh auto;text-align:center;padding:30px;
    background:var(--stall);border:1px solid var(--lantern);border-radius:16px;
  }
  .gameover h2{color:var(--lantern);}
</style>
</head>
<body>

<div id="login">
  <h2>🏮 ตลาดนัดนักเรียน</h2>
  <input id="nameInput" placeholder="ชื่อของเธอ" maxlength="20">
  <input id="codeInput" placeholder="รหัสห้อง (ครูให้)" maxlength="20">
  <button onclick="doJoin()">เข้าตลาด</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app">
<div class="topbar" style="display:none" id="topbar">
  <h1><span id="myAvatarLabel">🏮</span> <span id="gameNameLabel">ตลาดนัดนักเรียน</span></h1>
  <div class="stats">
    <div class="timer" id="timerBox">⏳ --:--</div>
    <div class="cash">💰 <span id="cashLabel">0</span></div>
  </div>
</div>

<main id="main">

<div id="gameOverBox" class="gameover" style="display:none">
  <h2>🏁 จบเกมแล้ว!</h2>
  <p>ดูอันดับสุดท้ายของทุกคนได้ด้านล่าง</p>
</div>

<div class="grid">
  <div>
    <div class="card">
      <h3>🏭 ซื้อจากซัพพลายเออร์กลาง (ราคาขยับตลอดเวลา)</h3>
      <div id="supplierList"></div>
    </div>

    <div class="card">
      <h3>🛍️ ตลาดกลาง (แผงค้าของเพื่อน ๆ)</h3>
      <div id="marketList" class="stall-grid"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h3>🚚 รถขายของของฉัน</h3>
      <div id="shopBox"></div>
    </div>

    <div class="card">
      <h3>🎒 สต๊อกของฉัน</h3>
      <div id="myInventory"></div>
    </div>

    <div class="card">
      <h3>🏷️ ของที่ฉันวางขายอยู่</h3>
      <div id="myListings"></div>
    </div>

    <div class="card">
      <h3>🏆 กระดานผู้นำ</h3>
      <div id="leaderboard"></div>
    </div>
  </div>
</div>

</main>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================================
// ตั้งค่า URL ของ Google Apps Script Web App ที่ deploy แล้ว
// ==========================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwCQ34YaLFyu1almvgGEU1sojdCFj_IZs_hJ2WckOcmRgBB48i2HW-d_zPNpyjyJg95/exec";

let studentId = localStorage.getItem('marketStudentId') || null;
let pollTimer = null;
let latestSupplier = [];

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function api(action, payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

async function doJoin(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!name || !code){ msg.textContent = 'กรอกชื่อและรหัสห้องให้ครบ'; return; }
  msg.textContent = 'กำลังเข้าตลาด...';
  const r = await api('join', { name, code });
  if(r.error){ msg.textContent = r.error; return; }
  studentId = r.studentId;
  localStorage.setItem('marketStudentId', studentId);
  document.getElementById('login').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('main').classList.add('show');
  startPolling();
}

function startPolling(){
  fetchState();
  pollTimer = setInterval(fetchState, 3000);
}

async function fetchState(){
  if(!studentId) return;
  const s = await api('state', { studentId });
  if(s.error){
    showToast(s.error);
    localStorage.removeItem('marketStudentId');
    clearInterval(pollTimer);
    document.getElementById('login').style.display='block';
    document.getElementById('topbar').style.display='none';
    document.getElementById('main').classList.remove('show');
    return;
  }
  render(s);
}

function fmtTime(sec){
  if(sec === null) return '⏳ รอครูเริ่มเกม';
  const m = Math.floor(sec/60), s = sec%60;
  return `⏳ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function render(s){
  document.getElementById('gameNameLabel').textContent = s.gameName;
  document.getElementById('myAvatarLabel').textContent = vendorEmoji(s.student.name);
  document.getElementById('cashLabel').textContent = Math.round(s.student.cash).toLocaleString();
  const timerBox = document.getElementById('timerBox');
  timerBox.textContent = fmtTime(s.timeLeftSeconds);
  timerBox.classList.toggle('low', s.timeLeftSeconds !== null && s.timeLeftSeconds < 60);

  document.getElementById('gameOverBox').style.display = s.gameEnded ? 'block' : 'none';

  latestSupplier = s.supplierItems;
  truckStyles = s.truckStyles || truckStyles;
  truckCost = s.truckCost || 0;
  myShop = s.myShop || myShop;
  renderSupplier(s.supplierItems);
  renderShop(s.myShop, s.truckCost, s.truckStyles);
  renderMarket(s.market, s.gameEnded);
  renderInventory(s.inventory, s.gameEnded, s.myShop && s.myShop.opened);
  renderMyListings(s.myListings, s.gameEnded);
  renderLeaderboard(s.leaderboard, s.student.name);
}

let truckStyles = [];
let truckCost = 0;
let myShop = { opened: false, name: '', styleId: null };
let shopFormStyleId = null; // สไตล์ที่เลือกไว้ชั่วคราวในฟอร์ม
let shopEditing = false;

function styleById(id){ return truckStyles.find(t => t.id === id) || truckStyles[0] || {id:'red',label:'',emoji:'🚚',colorA:'#d1453a',colorB:'#f7ded9'}; }

function renderShop(shop, cost, styles){
  const el = document.getElementById('shopBox');
  if(!shop) return;

  if(shop.opened && !shopEditing){
    const st = styleById(shop.styleId);
    el.innerHTML = `
      <div class="shop-summary">
        <div class="truck-emoji-badge">${st.emoji}</div>
        <div class="shop-summary-info">
          <div class="shop-summary-name">${shop.name}</div>
          <div class="shop-summary-tag">ธีม: ${st.label}</div>
        </div>
      </div>
      <button class="btn btn-edit-shop" style="margin-top:10px;width:100%" onclick="startEditShop()">✏️ แก้ไขร้าน/เปลี่ยนธีม</button>
    `;
    return;
  }

  // ฟอร์มตั้งร้าน (ครั้งแรก) หรือแก้ไขร้าน
  if(shopFormStyleId === null){
    shopFormStyleId = shop.opened ? shop.styleId : (styles[0] && styles[0].id);
  }
  const intro = shop.opened
    ? `<p style="font-size:0.82rem;color:#9fb8ae;margin:0 0 6px">แก้ไขชื่อร้าน/ธีมรถได้ฟรี</p>`
    : `<p style="font-size:0.82rem;color:#9fb8ae;margin:0 0 6px">ต้องมีรถขายของก่อนถึงจะวางขายในตลาดกลางได้ (ค่าเปิดร้าน ${cost} บ.)</p>`;

  el.innerHTML = `
    ${intro}
    <input class="shop-name-input" id="shopNameInput" maxlength="24" placeholder="ตั้งชื่อร้าน เช่น มะม่วงพี่หนึ่ง" value="${shop.opened ? shop.name : ''}">
    <div class="shop-setup-styles" id="styleChoices">
      ${styles.map(st => `
        <div class="style-choice ${st.id===shopFormStyleId?'selected':''}" onclick="selectShopStyle('${st.id}')">
          <div class="swatch-emoji">${st.emoji}</div>
          <div>${st.label}</div>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-shop" onclick="${shop.opened ? 'submitUpdateShop()' : 'submitOpenShop()'}">
      ${shop.opened ? '💾 บันทึกการแก้ไข' : `🚚 เปิดร้าน (เสียเงิน ${cost} บ.)`}
    </button>
    ${shop.opened ? `<button class="btn btn-cancel" style="margin-top:8px;width:100%" onclick="cancelEditShop()">ยกเลิก</button>` : ''}
  `;
}

function selectShopStyle(id){
  shopFormStyleId = id;
  renderShop(myShop, truckCost, truckStyles);
}

function startEditShop(){
  shopEditing = true;
  shopFormStyleId = myShop.styleId;
  renderShop(myShop, truckCost, truckStyles);
}

function cancelEditShop(){
  shopEditing = false;
  shopFormStyleId = null;
  renderShop(myShop, truckCost, truckStyles);
}

async function submitOpenShop(){
  const shopName = document.getElementById('shopNameInput').value.trim();
  if(!shopName){ showToast('ตั้งชื่อร้านก่อนนะ'); return; }
  const r = await api('openShop', { studentId, shopName, styleId: shopFormStyleId });
  if(r.error){ showToast(r.error); return; }
  showToast('เปิดร้านสำเร็จ! ยินดีต้อนรับสู่ตลาด 🎉');
  shopFormStyleId = null;
  fetchState();
}

async function submitUpdateShop(){
  const shopName = document.getElementById('shopNameInput').value.trim();
  const r = await api('updateShop', { studentId, shopName, styleId: shopFormStyleId });
  if(r.error){ showToast(r.error); return; }
  showToast('บันทึกร้านค้าแล้ว');
  shopEditing = false;
  shopFormStyleId = null;
  fetchState();
}

let itemEmojiMap = {};
function itemEmoji(name){ return itemEmojiMap[name] || '📦'; }

function renderSupplier(items){
  items.forEach(it => itemEmojiMap[it.itemName] = it.emoji || '📦');
  const el = document.getElementById('supplierList');
  el.innerHTML = items.map(it => `
    <div class="item-row">
      <div class="emoji">${it.emoji||'📦'}</div>
      <div class="item-name">${it.itemName}</div>
      <div class="item-price">${it.price} บ.</div>
      <input class="qty-input" type="number" min="1" value="1" id="buyqty_${it.itemName}">
      <button class="btn btn-buy" onclick="buySupplier('${it.itemName}')">ซื้อ</button>
    </div>
  `).join('') || '<div class="empty">ยังไม่มีสินค้า</div>';
}

// อวตาร์แม่ค้า/พ่อค้า สุ่มแบบ deterministic ตามชื่อ (คนเดิมได้อวตาร์เดิมเสมอ)
const VENDOR_EMOJIS = ['🧕','👩‍🌾','👨‍🌾','🧑‍🍳','👩‍🍳','👨‍🍳','🧔','👵','👴','🙋‍♀️','🙋‍♂️','👩‍🦱','👨‍🦱','🧑‍🦳','👩‍🦳'];
const AWNING_PALETTES = [
  ['#d1453a','#f4ecd8'], ['#2f8f6f','#f4ecd8'], ['#c94f8a','#f4ecd8'],
  ['#3f6fbf','#f4ecd8'], ['#c98a2c','#f4ecd8'], ['#7f5aa2','#f4ecd8'],
  ['#2c8f8f','#f4ecd8'], ['#b25a3c','#f4ecd8']
];
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function vendorEmoji(name){ return VENDOR_EMOJIS[hashStr(name) % VENDOR_EMOJIS.length]; }
function vendorPalette(name){ return AWNING_PALETTES[hashStr(name) % AWNING_PALETTES.length]; }

function renderMarket(listings, ended){
  const el = document.getElementById('marketList');
  if(!listings.length){ el.innerHTML = '<div class="empty">ยังไม่มีใครวางขาย ลองรอเพื่อนวางของดูนะ</div>'; return; }

  // จัดกลุ่มของตามคนขาย ให้แต่ละคนมีรถขายของเป็นของตัวเอง
  const bySeller = {};
  listings.forEach(l => {
    const key = l.sellerId || l.sellerName;
    if(!bySeller[key]) bySeller[key] = { sellerName: l.sellerName, shopName: l.shopName, styleId: l.styleId, goods: [] };
    bySeller[key].goods.push(l);
  });

  el.innerHTML = Object.values(bySeller).map(({sellerName, shopName, styleId, goods}) => {
    const st = styleId ? styleById(styleId) : null;
    const emoji = st ? st.emoji : vendorEmoji(sellerName);
    const colorA = st ? st.colorA : vendorPalette(sellerName)[0];
    const colorB = st ? st.colorB : '#2a4a42';
    const displayName = shopName || ('แผง' + sellerName);

    const goodsHtml = goods.map(l => `
      <div class="truck-good">
        <div class="truck-good-top">
          <div class="truck-good-emoji">${itemEmoji(l.itemName)}</div>
          <div class="truck-good-name">${l.itemName} <span class="truck-tag" style="color:#9fb8ae">(เหลือ ${l.qty})</span></div>
          <div class="truck-good-price">${l.price} บ.</div>
        </div>
        <div class="truck-good-controls">
          <input class="qty-input" type="number" min="1" max="${l.qty}" value="1" id="buymarket_${l.id}">
          <button class="btn btn-buy" ${ended?'disabled':''} onclick="buyListing('${l.id}')">ซื้อ</button>
        </div>
      </div>
    `).join('');
    return `
      <div class="truck" style="--truck-a:${colorA};--truck-b:${colorB}">
        <div class="truck-header">
          <div class="truck-emoji-badge">${emoji}</div>
          <div>
            <div class="truck-name">${displayName}</div>
            <div class="truck-tag">โดย ${sellerName} · ${goods.length} รายการ</div>
          </div>
        </div>
        <div class="truck-window">
          <div class="truck-goods">${goodsHtml}</div>
        </div>
        <div class="truck-wheels"><div class="truck-wheel"></div><div class="truck-wheel"></div></div>
      </div>
    `;
  }).join('');
}

function renderInventory(inv, ended, shopOpened){
  const el = document.getElementById('myInventory');
  if(!inv.length){ el.innerHTML = '<div class="empty">ยังไม่มีของในสต๊อก ลองซื้อจากซัพพลายเออร์ดูสิ</div>'; return; }
  const hint = !shopOpened ? `<div class="empty" style="margin-bottom:8px">🚚 เปิดร้านรถขายของก่อน ถึงจะวางขายในตลาดกลางได้ (ดูการ์ดด้านบน)</div>` : '';
  el.innerHTML = hint + inv.map(i => `
    <div class="inv-item">
      <div class="item-name">${i.itemName} x${i.qty}<br><span class="inv-cost">ต้นทุนเฉลี่ย ${i.avgCost} บ./ชิ้น</span></div>
      <input class="qty-input" type="number" min="1" max="${i.qty}" value="1" id="sellqty_${i.itemName}">
      <input class="price-input" type="number" min="1" placeholder="ราคาขาย" id="sellprice_${i.itemName}">
      <button class="btn btn-sell" ${(ended || !shopOpened)?'disabled':''} onclick="listForSale('${i.itemName}')">วางขาย</button>
    </div>
  `).join('');
}

function renderMyListings(listings, ended){
  const el = document.getElementById('myListings');
  if(!listings.length){ el.innerHTML = '<div class="empty">ยังไม่มีของวางขาย</div>'; return; }
  el.innerHTML = listings.map(l => `
    <div class="item-row">
      <div class="item-name">${l.itemName} x${l.qty} @ ${l.price} บ.</div>
      <button class="btn btn-cancel" ${ended?'disabled':''} onclick="cancelListing('${l.id}')">ยกเลิก</button>
    </div>
  `).join('');
}

function renderLeaderboard(list, myName){
  const el = document.getElementById('leaderboard');
  el.innerHTML = list.map((p, idx) => `
    <div class="leaderboard-row ${p.name===myName?'me':''}">
      <div class="rank">${idx+1}</div>
      <div class="lb-name">${p.name}</div>
      <div class="lb-worth">${p.netWorth.toLocaleString()} บ.</div>
    </div>
  `).join('');
}

async function buySupplier(itemName){
  const qty = Number(document.getElementById(`buyqty_${itemName}`).value);
  const r = await api('buyFromSupplier', { studentId, itemName, qty });
  if(r.error) showToast(r.error); else showToast(`ซื้อ ${itemName} x${qty} สำเร็จ`);
  fetchState();
}

async function listForSale(itemName){
  const qty = Number(document.getElementById(`sellqty_${itemName}`).value);
  const price = Number(document.getElementById(`sellprice_${itemName}`).value);
  if(!price){ showToast('ใส่ราคาขายด้วย'); return; }
  const r = await api('listForSale', { studentId, itemName, qty, price });
  if(r.error) showToast(r.error); else showToast(`วางขาย ${itemName} x${qty} แล้ว`);
  fetchState();
}

async function cancelListing(listingId){
  const r = await api('cancelListing', { studentId, listingId });
  if(r.error) showToast(r.error); else showToast('ยกเลิกรายการแล้ว');
  fetchState();
}

async function buyListing(listingId){
  const qty = Number(document.getElementById(`buymarket_${listingId}`).value);
  const r = await api('buyListing', { studentId, listingId, qty });
  if(r.error) showToast(r.error); else showToast(`ซื้อสำเร็จ! -${r.total} บ.`);
  fetchState();
}

// ถ้าเคยเข้าเกมไปแล้ว (มี studentId ใน localStorage) ให้เข้าเลย
if(studentId){
  document.getElementById('login').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('main').classList.add('show');
  startPolling();
}
</script>
